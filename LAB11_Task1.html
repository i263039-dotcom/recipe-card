<!DOCTYPE html>
<html>
<head>
  <title>Recipe Card</title>

</head>
<body>

  <div class="recipe-card">
    
    <!-- Title & Dish Name -->
    <h1>Recipe Card</h1>
    <h2>Dish Name: Pepperoni Pizza</h2>

    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300" width="300" alt="Pizza">

    <div class="three-columns">
      
      <div class="column">
        <h3>Ingredients</h3>
        <ul>
          <li>Pizza dough</li>
          <li>Tomato sauce</li>
          <li>Cheese</li>
          <li>Pepperoni</li>
        </ul>
      </div>

      <div class="column">
        <h3>Nutrient Table</h3>
        <table>
          <tr>
            <th>Nutrient</th>
            <th>Amount</th>
          </tr>
          <tr>
            <td>Calories</td>
            <td>350 kcal</td>
          </tr>
          <tr>
            <td>Protein</td>
            <td>14 g</td>
          </tr>
        </table>
      </div>

      <div class="column">
        <h3>Instruction</h3>
        <ol>
          <li>Preheat oven.</li>
          <li>Roll dough.</li>
          <li>Add toppings.</li>
          <li>Bake pizza.</li>
        </ol>
      </div>

    </div>

    <button onclick="startCooking()">START</button>

  </div>
  <script>
    function startCooking() {
      alert("Start Cooking");
    }
  </script>

</body>
</html>
